<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng 8/3 - Lá thư bất ngờ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Background image hoa anh đào đẹp */
            background-image: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1776&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 15px;
            /* Lớp phủ màu hồng nhẹ để chữ dễ đọc hơn */
            position: relative;
        }

        /* Lớp phủ overlay cho background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 230, 240, 0.3); /* lớp phủ hồng nhạt */
            z-index: 0;
            pointer-events: none;
        }

        .card {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 40px 40px 30px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25), 0 0 0 4px #fff3f5 inset;
            text-align: center;
            padding: 30px 25px 40px 25px;
            position: relative;
            overflow: hidden;
            border: 2px solid white;
            z-index: 1;
            cursor: grab; /* Thêm cursor grab để biểu thị có thể kéo */
            user-select: none; /* Ngăn chọn text khi kéo */
            transition: box-shadow 0.2s; /* Giữ lại transition cho đẹp */
        }

        .card:active {
            cursor: grabbing; /* Đổi cursor khi đang kéo */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 4px #fff3f5 inset; /* Hiệu ứng khi kéo */
        }
        

        /* Hiệu ứng hoa rơi nền */
        .flower-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .flower {
            position: absolute;
            color: rgba(255, 200, 220, 0.5);
            font-size: 24px;
            user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10%) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Nội dung chính */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        /* Phần avatar và tiêu đề - ĐƯA LÊN TRÊN CÙNG */
        .top-section {
            order: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3.2rem;
            color: #d43f5e;
            text-shadow: 2px 2px 0 #ffe6eb, 4px 4px 0 rgba(255, 105, 135, 0.3);
            margin-bottom: 5px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .sub-title {
            font-size: 1.7rem;
            font-weight: 600;
            background: linear-gradient(135deg, #c0395f, #e6718b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .avatar {
            width: 150px;
            height: 150px;
            margin: 10px auto 15px;
            background: #ffe2e7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 25px #ffb6c1, 0 0 0 5px white;
            transition: 0.3s;
        }

        .avatar svg {
            width: 100px;
            height: 100px;
            fill: #b3435f;
        }

        .avatar:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px #faa0ae;
        }

        /* Phần lời chúc ở giữa */
        .middle-section {
            order: 2;
        }

        .message {
            font-size: 1.25rem;
            color: #4a2c2f;
            background: #fff0f2ee;
            padding: 20px 18px;
            border-radius: 50px 50px 50px 10px;
            margin: 15px 0 25px;
            line-height: 1.6;
            box-shadow: 0 8px 12px #ffd9df;
            border-left: 6px solid #ff7b9c;
            font-weight: 500;
            text-align: left;
            backdrop-filter: blur(5px);
        }

        /* Phần chữ ký ở giữa */
        .signature {
            margin: 20px 0 25px;
            font-size: 1.2rem;
            font-style: italic;
            color: #a6576a;
            border-top: 2px solid #ffb6c9;
            padding-top: 15px;
        }

        .heart {
            color: #ff4d6d;
            font-size: 2rem;
            line-height: 0.8;
        }

        /* Khu vực LÁ THƯ - ĐƯA XUỐNG DƯỚI CÙNG */
        .bottom-section {
            order: 3;
            margin-top: 10px;
        }

        .letter-area {
            background: rgba(255, 240, 217, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 80px 80px 30px 30px;
            padding: 20px 15px 25px;
            border: 2px dashed #ff98a8;
            transition: 0.4s;
            cursor: pointer;
        }

        .letter-area:active {
            transform: scale(0.98);
        }

        .letter-title {
            font-size: 2rem;
            margin-bottom: 10px;
            filter: drop-shadow(2px 2px 2px rgba(190, 70, 90, 0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .letter-icon {
            font-size: 3.5rem;
            transition: 0.3s;
            filter: drop-shadow(0 8px 10px #ffa5b9);
        }

        .click-hint {
            font-size: 1.1rem;
            color: #b3435f;
            background: #ffe9ee;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            margin: 10px 0;
            font-weight: 500;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); background: #ffe1e8; }
            100% { transform: scale(1); }
        }

        .letter-content {
            background: #fee1e7;
            border-radius: 35px;
            padding: 25px;
            margin-top: 20px;
            font-size: 1.3rem;
            color: #b83b56;
            border: 3px solid white;
            box-shadow: inset 0 0 15px #ffe2ed, 0 10px 10px rgba(0,0,0,0.05);
            transform: scale(0);
            opacity: 0;
            transition: 0.25s;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        .letter-content.show {
            transform: scale(1);
            opacity: 1;
        }

        .letter-content span {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        /* responsive */
        @media (max-width: 450px) {
            h1 { font-size: 2.5rem; }
            .sub-title { font-size: 1.3rem; }
            .avatar { width: 120px; height: 120px; }
            .avatar svg { width: 80px; height: 80px; }
            .letter-icon { font-size: 2.8rem; }
            .letter-content { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Hoa rơi nền -->
        <div class="flower-bg" id="flowerContainer"></div>

        <div class="content">
            <!-- PHẦN TRÊN CÙNG: Avatar và tiêu đề -->
            <div class="top-section">
                <h1>🌷 8/3 🌷</h1>
                <div class="sub-title">✨ Dành tặng các bạn nữ 12A1 2952 ✨</div>

                <!-- Icon avatar dễ thương - TO HƠN VÀ NỔI BẬT Ở TRÊN -->
                <div class="avatar">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 1.88.68 3.58 1.8 4.89L12 22l5.2-8.11A6.978 6.978 0 0019 9c0-3.87-3.13-7-7-7zm0 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    </svg>
                </div>
            </div>

            <!-- PHẦN GIỮA: Lời chúc và chữ ký -->
            <div class="middle-section">
                <!-- Lời chúc ý nghĩa -->
                <div class="message">
                     
                    Chúc các bạn luôn vui tươi, xinh đẹp và hạnh phúc. Cảm ơn vì đã là một nửa tuyệt vời của thế giới này! 
                </div>

                <div class="signature">
                    <span class="heart">❤️</span> Ngàn lời yêu thương, gửi tặng bạn! <span class="heart">❤️</span>
                </div>
            </div>

            <!-- PHẦN DƯỚI CÙNG: Lá thư bí mật -->
            <div class="bottom-section">
                <div class="letter-area" id="letterArea">
                    <div class="letter-title">
                        <span class="letter-icon" id="letterIcon">💌</span>
                        LÁ THƯ TẶNG BẠN
                    </div>
                    <div class="click-hint" id="clickHint">👉 Bấm vào lá thư để mở 👈</div>
                    <div class="letter-content" id="letterContent">
                        <!-- Nội dung sẽ được thay bằng JS khi bấm -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // --- Tạo hiệu ứng hoa rơi ---
            const flowerContainer = document.getElementById('flowerContainer');
            const flowers = ['🌸', '🌼', '🌺', '🌷', '🌹', '🌸', '🌼', '🌷'];
            for (let i = 0; i < 20; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
                flower.style.left = Math.random() * 100 + '%';
                flower.style.animationDuration = (Math.random() * 5 + 5) + 's';
                flower.style.fontSize = (Math.random() * 20 + 20) + 'px';
                flower.style.animationDelay = Math.random() * -10 + 's';
                flowerContainer.appendChild(flower);
            }

            // --- Xử lý bấm vào lá thư ---
            const letterArea = document.getElementById('letterArea');
            const letterIcon = document.getElementById('letterIcon');
            const clickHint = document.getElementById('clickHint');
            const letterContent = document.getElementById('letterContent');
            let isOpened = false;

            // Những lời chúc bất ngờ bên trong lá thư
            const secretMessages = [
                { icon: '💖', text: 'Chúc em luôn ngọt ngào và hạnh phúc như những viên kẹo!' },
                { icon: '🌟', text: 'Em là ánh sáng rực rỡ nhất trong cuộc đời anh. Yêu em!' },
                { icon: '🌸', text: 'Cảm ơn em đã đến và thổi hồn vào thế giới của anh!' },
                { icon: '🌹', text: 'Tặng em đóa hồng này, và cả trái tim anh nữa!' },
                { icon: '🎀', text: 'Hôm nay và mãi mãi, em luôn là đặc biệt nhất!' },
                { icon: '💝', text: 'Chúc em luôn tươi cười - nụ cười của em là món quà quý giá!' },
                { icon: '✨', text: '8/3 vui vẻ nhé công chúa của anh!' },
                { icon: '🎂', text: 'Em ngọt ngào hơn cả bánh kem, đáng yêu hơn cả nắng mai!' },
                { icon: '🐱', text: 'Dễ thương như mèo con, đáng yêu như nắng mới!' },
                { icon: '🍰', text: 'Tặng em chiếc bánh ngọt, ngọt ngào như tình yêu anh dành cho em!' }
            ];

            letterArea.addEventListener('click', function() {
                // Random một lời chúc
                const randomMsg = secretMessages[Math.floor(Math.random() * secretMessages.length)];
                
                if (!isOpened) {
                    // Lần đầu mở
                    letterContent.innerHTML = `<span>${randomMsg.icon}</span> ${randomMsg.text}`;
                    letterContent.classList.add('show');
                    
                    // Đổi icon lá thư thành icon đã mở
                    letterIcon.textContent = '💌✨';
                    
                    // Ẩn dòng chữ hướng dẫn
                    clickHint.style.opacity = '0';
                    clickHint.style.transition = '0.3s';
                    
                    isOpened = true;
                } else {
                    // Những lần bấm sau: đổi lời chúc khác (vẫn giữ trạng thái mở)
                    letterContent.innerHTML = `<span>${randomMsg.icon}</span> ${randomMsg.text}`;
                    
                    // Thêm hiệu ứng nhấp nháy nhẹ
                    letterContent.style.transform = 'scale(0.95)';
                    setTimeout(() => letterContent.style.transform = 'scale(1)', 150);
                }
            });

            // Thêm hiệu ứng hover cho lá thư
            letterArea.addEventListener('mouseenter', function() {
                if (!isOpened) {
                    letterIcon.style.transform = 'scale(1.1) rotate(5deg)';
                }
            });

            letterArea.addEventListener('mouseleave', function() {
                letterIcon.style.transform = 'scale(1) rotate(0deg)';
            });

        })();
    </script>
</body>
</html>
